<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bear Bot Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #121019;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }
    .header-title {
      font-size: 26px; font-weight: 900; text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #B8A8FE 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-top: 10px;
    }
    .header-sub { font-size: 13px; color: #8E8B9E; margin: 4px 0 15px; }
    .wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 10px 0; }
    .wheel-container {
      width: 100%; height: 100%; border-radius: 50%; border: 6px solid #8D73E0;
      position: relative; overflow: hidden;
      transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1);
      background: #DCD3FD; box-shadow: 0 0 25px rgba(141, 115, 224, 0.3);
    }
    .wheel-pointer {
      position: absolute; right: -10px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; background: #8D73E0;
      clip-path: polygon(100% 50%, 0 0, 0 100%); z-index: 10;
    }
    .spins-left { margin-top: 15px; font-size: 14px; color: #928FA4; }
    .btn-main {
      width: 100%; max-width: 340px; height: 48px; background: #6C38CC;
      color: #FFF; border: none; border-radius: 14px; font-size: 16px;
      font-weight: bold; margin-top: 15px; cursor: pointer;
    }
    .btn-main:disabled { background: #39354A; color: #777; cursor: not-allowed; }
    
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); display: none;
      align-items: center; justify-content: center; z-index: 100;
      padding: 20px;
    }
    .modal-card {
      width: 100%; max-width: 320px; background: #1C1926;
      border-radius: 20px; padding: 24px; text-align: center;
      border: 1px solid #3D3850;
    }
    .modal-icon { font-size: 48px; margin-bottom: 10px; }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: #AAA; margin-bottom: 20px; line-height: 1.4; }
    .btn-close {
      width: 100%; height: 44px; background: #6C38CC; border: none;
      border-radius: 12px; color: #FFF; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-title">КРУТИ КОЛЕСО</div>
  <div class="header-sub">И выигрывай подарки бесплатно</div>

  <div class="wheel-wrapper">
    <div class="wheel-pointer"></div>
    <div class="wheel-container" id="wheel">
      <canvas id="wheelCanvas" width="280" height="280"></canvas>
    </div>
  </div>

  <div class="spins-left">Доступно прокрутов: <span id="spinsCount">1</span></div>
  <button class="btn-main" id="spinBtn" onclick="startSpin()">Крутить!</button>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <div class="modal-icon" id="resIcon">🎁</div>
      <div class="modal-title" id="resTitle">Результат</div>
      <div class="modal-desc" id="resDesc">Описание</div>
      <button class="btn-close" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    // 8 СЕКТОРОВ: Пусто (3 раза), Звезды (2 раза), остальные по 1 разу
    const segments = ['Пусто ⚪', '⭐ Звезды', 'Пусто ⚪', '🖼️ NFT', 'Пусто ⚪', '🐻 Мишка', '⭐ Звезды', '🌹 Роза'];
    const colors = ['#FFFFFF', '#EFE9FE', '#FFFFFF', '#C3B1FF', '#FFFFFF', '#EFE9FE', '#B096FF', '#EFE9FE'];

    function drawWheel() {
      const numSegments = segments.length;
      const angleArc = (2 * Math.PI) / numSegments;
      const radius = 140;
      for (let i = 0; i < numSegments; i++) {
        const angle = i * angleArc;
        ctx.beginPath(); ctx.fillStyle = colors[i];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + angleArc);
        ctx.fill();
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + angleArc / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#4A30A0";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(segments[i], radius - 15, 4);
        ctx.restore();
      }
    }
    drawWheel();

    let isSpinning = false;
    let currentRotation = 0;

    function startSpin() {
      if (isSpinning) return;
      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      currentRotation += 360 * 5 + Math.floor(Math.random() * 360);
      document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        document.getElementById('spinBtn').disabled = false;

        // ЖЕСТКИЕ ШАНСЫ (Пусто: 98%, Звезды: 1.8%, Подарки: < 0.2%)
        const rand = Math.random() * 100;
        let winItem = "Пусто ⚪";
        let winIcon = "😔";
        let winText = "В этот раз не повезло! Выпало пусто.";

        if (rand <= 0.01) {
          winItem = "🖼️️ NFT Star Gift"; winIcon = "🖼️";
          winText = "МЕГА ВЕЗЕНИЕ! Вы выбили NFT! Напишите @peredoz08";
        } else if (rand <= 0.05) {
          winItem = "🌹 Роза"; winIcon = "🌹";
          winText = "Вам выпала Роза! Напишите @peredoz08";
        } else if (rand <= 0.20) {
          winItem = "🐻 Мишка"; winIcon = "🐻";
          winText = "Вам выпал Мишка! Напишите @peredoz08";
        } else if (rand <= 2.00) {
          winItem = "⭐ Звезды"; winIcon = "⭐";
          winText = "Вы выиграли +10 Звезд!";
        }

        document.getElementById('resIcon').innerText = winIcon;
        document.getElementById('resTitle').innerText = winItem;
        document.getElementById('resDesc').innerText = winText;
        document.getElementById('resultModal').style.display = 'flex';

      }, 4100);
    }

    function closeModal() {
      document.getElementById('resultModal').style.display = 'none';
    }
  </script>
</body>
</html>
