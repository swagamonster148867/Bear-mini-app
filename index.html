<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #242424);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 320px;
        }
        .icon {
            font-size: 70px;
            margin-bottom: 10px;
        }
        h2 { margin: 10px 0; font-size: 22px; }
        p { color: #aaaaaa; font-size: 14px; line-height: 1.4; margin-bottom: 20px; }
        .spin-btn {
            background: #2ea6ff;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        .spin-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🐻</div>
        <h2>Bear Bot Mini App</h2>
        <p>Испытайте удачу! Выигрывайте Алмазы, NFT, Розы, Мишек и Звезды.</p>
        <button class="spin-btn" onclick="spin()">🎰 Крутить Рулетку</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function spin() {
            tg.sendData("spin_roulette");
            tg.close();
        }
    </script>
</body>
  
</html>
